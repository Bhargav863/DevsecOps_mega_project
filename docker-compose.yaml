version: '3.8'

services:

  mysql:
   image: mysql:8
   container_name: mysql
   restart: always
   environment:
     MYSQL_ROOT_PASSWORD: Bhargav
     MYSQL_DATABASE: crud_app
   volumes:
     - mysql-data:/var/lib/mysql
     - ./mysql-init:/docker-entrypoint-initdb.d
   ports:
     - "3306:3306"
   healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pBhargav"]
      interval: 10s
      timeout: 5s
      retries: 10
    
  backend:
   build: ./api
   container_name: backend-api
   environment:
     DB_HOST: mysql
     DB_USER: root
     DB_PASSWORD: Bhargav
     DB_NAME: crud_app
     JWT_SECRET: devopsShackSuperSecretKey
     RESET_ADMIN_PASS: 'true'
   depends_on:
    - mysql
   ports:
    - "5000:5000"
  
  frontend:
   build: ./client
   container_name: Frontend-react
   depends_on:
    - backend
   ports:
    - "3000:80"

volumes:
  mysql-data:
